<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b35"><meta name="description" content="Repaso intensivo de alemán accesible y adaptable"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Strudel Intensiv</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#19352e;background:#f4f7f4;font-size:18px}*{box-sizing:border-box}body{margin:0}header{background:#183b35;color:#fff;padding:22px 18px}main{max-width:740px;margin:auto;padding:18px 14px 80px}h1{font-size:1.65rem;margin:0 0 5px}h2{font-size:1.3rem}p{line-height:1.6}.muted{opacity:.78}.card{background:#fff;border:1px solid #dce7de;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #173d2810}.btn{background:#206d54;color:white;border:0;border-radius:12px;padding:15px 18px;min-height:50px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#e7eee9;color:#173c2d}.btn:focus-visible,.option:focus-visible{outline:4px solid #edb34c;outline-offset:3px}.option{display:block;width:100%;text-align:left;background:#f5f8f5;color:#17372e;border:2px solid #d9e4dc;border-radius:12px;padding:16px;margin:10px 0;font:inherit;cursor:pointer}.option[disabled]{opacity:.72}.option.good{background:#d8f3e4;border-color:#248352}.option.bad{background:#ffe4e0;border-color:#b64a3b}.pill{display:inline-block;background:#dbece1;border-radius:99px;padding:6px 12px;font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:9px}.bar{background:#e0e8e1;border-radius:20px;height:12px;overflow:hidden}.fill{height:100%;background:#25815e}.lesson{border-left:6px solid #d99d43}#app{min-height:55vh}.small{font-size:.9rem}label{display:flex;align-items:center;gap:10px}input[type=checkbox]{width:24px;height:24px}body.large{font-size:22px}body.dark{background:#121c19;color:#eaf3ee}body.dark .card{background:#1f302a;border-color:#3d554a}body.dark .option,body.dark .btn.secondary{background:#31463c;color:#fff;border-color:#50685b}body.dark .pill{background:#355446;color:#fff}body.dark .bar{background:#3d5148}body.dark .muted{opacity:.9}button:disabled{cursor:default}footer{text-align:center;font-size:.78rem;opacity:.75;padding:16px}
</style></head><body><header><div style="max-width:740px;margin:auto"><h1>🥨 Strudel Intensiv</h1><div class="muted">Deutsch lernen · A0 → A1 · V.I.V.A. Academy</div></div></header><main><div class="card"><div class="actions" style="justify-content:space-between;align-items:center"><span class="pill" id="status">Cargando…</span><div class="actions"><button class="btn secondary" onclick="toggleLarge()" aria-label="Alternar texto grande">Aᴀ / A+</button><button class="btn secondary" onclick="toggleDark()" aria-label="Alternar modo oscuro">◐</button></div></div></div><div id="app"></div></main><footer>Material didáctico original · Inspirado en objetivos de nivel A1 · No afiliado a Hueber</footer><script>
let lessons=[],selected=null,question=0,score=0,locked=false;let saved=JSON.parse(localStorage.getItem('strudel-progress')||'{}');const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('strudel-progress',JSON.stringify(saved));function toggleLarge(){document.body.classList.toggle('large');localStorage.setItem('strudel-large',document.body.classList.contains('large')?'1':'0')}function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('strudel-dark',document.body.classList.contains('dark')?'1':'0')}if(localStorage.getItem('strudel-large')==='1')document.body.classList.add('large');if(localStorage.getItem('strudel-dark')==='1')document.body.classList.add('dark');function speak(s){if(!('speechSynthesis'in window)){alert('Tu navegador no dispone de lectura de voz.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}function home(){selected=null;let done=lessons.filter(l=>saved[l.id]?.done).length;document.getElementById('status').textContent=done+' de '+lessons.length+' lecciones completadas';app.innerHTML=`<section class="card"><h2>De cero, paso a paso 🇩🇪</h2><p>Esta primera versión incluye tres lecciones originales de práctica A1. Avanza a tu ritmo y escucha las frases.</p><div class="bar"><div class="fill" style="width:${lessons.length?100*done/lessons.length:0}%"></div></div><p class="small">${done} lecciones terminadas · progreso guardado en este dispositivo</p><h3>Tu rutina flexible de 90 minutos</h3><p>30 min de lección · 20 min de ejercicios · 25 min de escucha y habla · 15 min de repaso.</p><p class="small">En días agotadores, realiza solo 15 minutos. Descansar también forma parte del plan.</p></section><h2>Lecciones</h2>`+lessons.map((l,i)=>`<section class="card lesson"><span class="pill">Lección ${i+1} ${saved[l.id]?.done?'· ✓ Completada':''}</span><h2>${esc(l.title)}</h2><p>${esc(l.subtitle)}</p><button class="btn" onclick="openLesson(${i})">${saved[l.id]?.done?'Repasar':'Comenzar'} →</button></section>`).join('')+`<section class="card"><h2>👩‍🏫 Lehrer-Modus</h2><p>Para enseñar a niños principiantes: comienza con saludos, nombres y canciones de repetición. Usa instrucciones cortas como «Hallo!», «Hört zu!» (escuchen) y «Noch einmal!» (otra vez).</p><button class="btn secondary" onclick="speak('Hallo! Hört zu! Noch einmal! Sehr gut!')">🔊 Escuchar frases de aula</button></section>`}function openLesson(i){selected=i;question=0;score=0;let l=lessons[i];document.getElementById('status').textContent='Lección '+(i+1);app.innerHTML=`<button class="btn secondary" onclick="home()">← Volver</button><section class="card"><span class="pill">${esc(l.subtitle)}</span><h2>${esc(l.title)}</h2><p>${esc(l.explain)}</p><h3>Ejemplos</h3>${l.examples.map(x=>`<div class="card" style="margin:8px 0"><p lang="de">${esc(x)}</p><button class="btn secondary" data-speak="${esc(x)}">🔊 Escuchar</button></div>`).join('')}<div class="actions"><button class="btn" onclick="quiz()">Practicar →</button></div></section>`;app.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>speak(b.getAttribute('data-speak'))))}function quiz(){locked=false;let l=lessons[selected],q=l.questions[question];app.innerHTML=`<button class="btn secondary" onclick="openLesson(${selected})">← Explicación</button><section class="card"><span class="pill">Pregunta ${question+1} de ${l.questions.length}</span><h2>${esc(q.q)}</h2><div id="choices">${q.a.map((a,i)=>`<button class="option" onclick="choose(${i})">${esc(a)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section>`}function choose(i){if(locked)return;locked=true;let l=lessons[selected],q=l.questions[question];if(i===q.correct)score++;let bs=[...document.querySelectorAll('.option')];bs.forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('good');if(n===i&&n!==q.correct)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<p><strong>${i===q.correct?'✓ ¡Correcto!':'Todavía no. Sigue practicando.'}</strong></p><p>${esc(q.why)}</p><button class="btn" onclick="next()">${question+1===l.questions.length?'Ver resultado':'Siguiente →'}</button>`}function next(){let l=lessons[selected];if(++question<l.questions.length){quiz();return}let old=saved[l.id]||{};saved[l.id]={done:true,best:Math.max(old.best||0,score),total:l.questions.length};save();app.innerHTML=`<section class="card"><h2>🎉 ¡Lección terminada!</h2><p>Resultado: <strong>${score} de ${l.questions.length}</strong></p><p>${score===l.questions.length?'¡Excelente!':'Puedes repetirla para reforzar los errores.'}</p><div class="actions"><button class="btn" onclick="openLesson(${selected})">Repetir</button><button class="btn secondary" onclick="home()">Todas las lecciones</button></div></section>`}fetch('lessons.json').then(r=>{if(!r.ok)throw Error('Sin datos');return r.json()}).then(x=>{lessons=x;home()}).catch(()=>{app.innerHTML='<section class="card"><h2>No se cargaron las lecciones</h2><p>Abre la aplicación desde GitHub Pages o un servidor web; no abras index.html directamente como archivo.</p></section>'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
