<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b35"><meta name="description" content="Repaso intensivo de alemán accesible y adaptable"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Strudel Academy · Edición Académica 1.0</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#19352e;background:#f4f7f4;font-size:18px}*{box-sizing:border-box}body{margin:0}header{background:#183b35;color:#fff;padding:22px 18px}main{max-width:740px;margin:auto;padding:18px 14px 80px}h1{font-size:1.65rem;margin:0 0 5px}h2{font-size:1.3rem}p{line-height:1.6}.muted{opacity:.78}.card{background:#fff;border:1px solid #dce7de;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #173d2810}.btn{background:#206d54;color:white;border:0;border-radius:12px;padding:15px 18px;min-height:50px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#e7eee9;color:#173c2d}.btn:focus-visible,.option:focus-visible{outline:4px solid #edb34c;outline-offset:3px}.option{display:block;width:100%;text-align:left;background:#f5f8f5;color:#17372e;border:2px solid #d9e4dc;border-radius:12px;padding:16px;margin:10px 0;font:inherit;cursor:pointer}.option[disabled]{opacity:.72}.option.good{background:#d8f3e4;border-color:#248352}.option.bad{background:#ffe4e0;border-color:#b64a3b}.pill{display:inline-block;background:#dbece1;border-radius:99px;padding:6px 12px;font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:9px}.bar{background:#e0e8e1;border-radius:20px;height:12px;overflow:hidden}.fill{height:100%;background:#25815e}.lesson{border-left:6px solid #d99d43}#app{min-height:55vh}.small{font-size:.9rem}label{display:flex;align-items:center;gap:10px}input[type=checkbox]{width:24px;height:24px}body.large{font-size:22px}body.dark{background:#121c19;color:#eaf3ee}body.dark .card{background:#1f302a;border-color:#3d554a}body.dark .option,body.dark .btn.secondary{background:#31463c;color:#fff;border-color:#50685b}body.dark .pill{background:#355446;color:#fff}body.dark .bar{background:#3d5148}body.dark .muted{opacity:.9}button:disabled{cursor:default}footer{text-align:center;font-size:.78rem;opacity:.75;padding:16px}
 .card h2[lang="de"]{overflow-wrap:anywhere} [hidden]{display:none!important}textarea{max-width:100%;background:#fff;color:#17372e;border:2px solid #d9e4dc}body.dark textarea{background:#31463c;color:#fff}  .voc-table{width:100%;border-collapse:collapse}.voc-table th,.voc-table td{padding:8px;border-bottom:1px solid #9daaa2;text-align:left}.voc-table .btn{padding:7px;min-height:36px} </style></head><body><header><div style="max-width:740px;margin:auto"><h1>🥨 Strudel Academy</h1><div class="muted">Deutsch lernen · A0 → B1.1 · V.I.V.A. Academy · Edición académica 1.0</div></div></header><main><div class="card"><div class="actions" style="justify-content:space-between;align-items:center"><span class="pill" id="status">Cargando…</span><div class="actions"><button class="btn secondary" onclick="toggleLarge()" aria-label="Alternar texto grande">Aᴀ / A+</button><button class="btn secondary" onclick="toggleDark()" aria-label="Alternar modo oscuro">◐</button></div></div></div><div id="app"></div></main><footer>Material didáctico original · Inspirado en objetivos de nivel A1 · No afiliado a Hueber</footer><script>
let vocab=[],listening=[],selectedCard=null,cardQueue=[],cardIndex=0,listenIndex=0,listenScore=0;let lessons=[],selected=null,question=0,score=0,locked=false;let errors=JSON.parse(localStorage.getItem("strudel-errors")||"[]");let saved=JSON.parse(localStorage.getItem('strudel-progress')||'{}');const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('strudel-progress',JSON.stringify(saved));function toggleLarge(){document.body.classList.toggle('large');localStorage.setItem('strudel-large',document.body.classList.contains('large')?'1':'0')}function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('strudel-dark',document.body.classList.contains('dark')?'1':'0')}if(localStorage.getItem('strudel-large')==='1')document.body.classList.add('large');if(localStorage.getItem('strudel-dark')==='1')document.body.classList.add('dark');function speak(s){if(!('speechSynthesis'in window)){alert('Tu navegador no dispone de lectura de voz.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}function home(){selected=null;let done=lessons.filter(l=>saved[l.id]?.done).length;document.getElementById('status').textContent=done+' de '+lessons.length+' lecciones completadas';app.innerHTML=`<section class="card"><h2>Tu ruta académica · 60 lecciones 🇩🇪</h2><p>Esta versión incluye 60 unidades de práctica originales de A1.1 a B1.1, con contenidos de apoyo por nivel. Avanza a tu ritmo y escucha las frases.</p><div class="bar"><div class="fill" style="width:${lessons.length?100*done/lessons.length:0}%"></div></div><p class="small">${done} lecciones terminadas · progreso guardado en este dispositivo</p><h3>Tu rutina flexible de 90 minutos</h3><p>30 min de lección · 20 min de ejercicios · 25 min de escucha y habla · 15 min de repaso.</p><p class="small">En días agotadores, realiza solo 15 minutos. Descansar también forma parte del plan.</p><div class="actions"><button class="btn secondary" onclick="showPlan()">📅 Plan de 10 semanas</button><button class="btn secondary" onclick="showErrors()">🔁 Repasar errores (${errors.length})</button><button class="btn secondary" onclick="showDaily()">✅ Mi sesión de hoy</button><button class="btn secondary" onclick="showExam()">📝 Examen A1</button><button class="btn" onclick="showCards()">🗂️ Tarjetas y repaso</button><button class="btn" onclick="showListening()">🎧 Escucha activa</button></div></section><h2>Lecciones</h2>`+lessons.map((l,i)=>`<section class="card lesson" data-level="${esc(l.level||"A1.1")}"><span class="pill">${esc(l.level||"A1.1")} · Lección ${i+1} ${saved[l.id]?.done?'· ✓ Completada':''}</span><h2>${esc(l.title)}</h2><p>${esc(l.subtitle)}</p><button class="btn" onclick="openLesson(${i})">${saved[l.id]?.done?'Repasar':'Comenzar'} →</button></section>`).join('')+`<section class="card"><h2>👩‍🏫 Lehrer-Modus</h2><p>Para enseñar a niños principiantes: comienza con saludos, nombres y canciones de repetición. Usa instrucciones cortas como «Hallo!», «Hört zu!» (escuchen) y «Noch einmal!» (otra vez).</p><button class="btn secondary" onclick="speak('Hallo! Hört zu! Noch einmal! Sehr gut!')">🔊 Escuchar frases de aula</button><button class="btn secondary" onclick="showTeacher()">🎒 Actividades para niños</button></section>`}function openLesson(i){selected=i;question=0;score=0;let l=lessons[i];document.getElementById('status').textContent='Lección '+(i+1);app.innerHTML=`<button class="btn secondary" onclick="home()">← Volver</button><section class="card"><span class="pill">${esc(l.subtitle)}</span><h2>${esc(l.title)}</h2><p>${esc(l.explain)}</p><h3>Ejemplos</h3>${l.examples.map(x=>`<div class="card" style="margin:8px 0"><p lang="de">${esc(x)}</p><button class="btn secondary" data-speak="${esc(x)}">🔊 Escuchar</button></div>`).join('')}${renderAcademic(l)}<div class="actions"><button class="btn" onclick="quiz()">Practicar →</button><button class="btn secondary" onclick="showProduction(${i})">📖 Lectura, escritura y habla</button></div></section>`;app.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>speak(b.getAttribute('data-speak'))))}function quiz(){locked=false;let l=lessons[selected],q=l.questions[question];app.innerHTML=`<button class="btn secondary" onclick="openLesson(${selected})">← Explicación</button><section class="card"><span class="pill">Pregunta ${question+1} de ${l.questions.length}</span><h2>${esc(q.q)}</h2><div id="choices">${q.a.map((a,i)=>`<button class="option" onclick="choose(${i})">${esc(a)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section>`}function choose(i){if(locked)return;locked=true;let l=lessons[selected],q=l.questions[question];if(i===q.correct)score++;else{errors.push({lesson:l.title,question:q.q,answer:q.a[q.correct],why:q.why});errors=errors.slice(-100);localStorage.setItem("strudel-errors",JSON.stringify(errors));}let bs=[...document.querySelectorAll('.option')];bs.forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('good');if(n===i&&n!==q.correct)b.classList.add('bad')});document.getElementById('feedback').innerHTML=`<p><strong>${i===q.correct?'✓ ¡Correcto!':'Todavía no. Sigue practicando.'}</strong></p><p>${esc(q.why)}</p><button class="btn" onclick="next()">${question+1===l.questions.length?'Ver resultado':'Siguiente →'}</button>`}function next(){let l=lessons[selected];if(++question<l.questions.length){quiz();return}let old=saved[l.id]||{};saved[l.id]={done:true,best:Math.max(old.best||0,score),total:l.questions.length};save();app.innerHTML=`<section class="card"><h2>🎉 ¡Lección terminada!</h2><p>Resultado: <strong>${score} de ${l.questions.length}</strong></p><p>${score===l.questions.length?'¡Excelente!':'Puedes repetirla para reforzar los errores.'}</p><div class="actions"><button class="btn" onclick="openLesson(${selected})">Repetir</button><button class="btn secondary" onclick="home()">Todas las lecciones</button></div></section>`}function showPlan(){app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>📅 Plan flexible de 10 semanas</h2><p>Meta: A1 sólido y progresión hacia A2, con 90 minutos no consecutivos al día. No sacrifiques sueño.</p><ol><li>Semanas 1–2: lecciones iniciales, saludos, verbos y familia.</li><li>Semanas 3–4: lecciones 4–6, artículos y acusativo.</li><li>Semanas 5–6: lecciones 7–9, modales, horarios y pedidos.</li><li>Semanas 7–8: lecciones 10–12, transporte y Perfekt.</li><li>Semanas 9–10: repaso A1 y comienzo de A2 con materiales adicionales.</li></ol><p><strong>Bloques:</strong> 30 min libro, 20 min app, 25 min escuchar/hablar, 15 min repaso. Día difícil: 15 min.</p><p>Este cronograma es una guía flexible, no una certificación de nivel.</p></section>`}function showErrors(){app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>🔁 Cuaderno de errores</h2>${errors.length?errors.slice().reverse().map(x=>`<div class="card"><strong>${esc(x.lesson)}</strong><p>${esc(x.question)}</p><p>✓ ${esc(x.answer)}</p><p class="small">${esc(x.why)}</p></div>`).join(''):'<p>Aún no tienes errores registrados. ¡Empieza una lección!</p>'}<button class="btn secondary" onclick="if(confirm('¿Borrar historial de errores?')){errors=[];localStorage.removeItem('strudel-errors');showErrors()}" >Limpiar errores</button></section>`}
function todayKey(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function showDaily(){let key='strudel-day-'+todayKey(),v=JSON.parse(localStorage.getItem(key)||'[false,false,false,false]'),names=['📖 Libro Momente: 30 min','🧩 Ejercicios Strudel: 20 min','🗣️ Escuchar y hablar: 25 min','🔁 Vocabulario y errores: 15 min'];app.innerHTML='<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>Mi sesión · '+todayKey()+'</h2><p>Marca los bloques que completes, sin importar el orden ni la hora. Si estás agotado, 15 minutos también cuentan.</p>'+names.map((n,i)=>'<label class="card"><input type="checkbox" data-day="'+i+'" '+(v[i]?'checked':'')+'><span>'+n+'</span></label>').join('')+'<p id="dailyTotal"><strong>'+([30,20,25,15].reduce((a,x,i)=>a+(v[i]?x:0),0))+' / 90 minutos</strong></p></section>';app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('change',()=>{v[+b.dataset.day]=b.checked;localStorage.setItem(key,JSON.stringify(v));document.getElementById('dailyTotal').innerHTML='<strong>'+[30,20,25,15].reduce((a,x,i)=>a+(v[i]?x:0),0)+' / 90 minutos</strong>'}))}
let examQuestions=[],examIndex=0,examScore=0,examLocked=false;
function showExam(){examQuestions=lessons.flatMap(l=>[l.questions[0],l.questions[3],l.questions[6]].filter(Boolean));examIndex=0;examScore=0;examRender()}
function examRender(){examLocked=false;if(examIndex>=examQuestions.length){let pct=Math.round(100*examScore/examQuestions.length);localStorage.setItem('strudel-exam-last',JSON.stringify({date:todayKey(),score:examScore,total:examQuestions.length}));app.innerHTML='<section class="card"><h2>Resultado del examen A1</h2><p><strong>'+examScore+' de '+examQuestions.length+' ('+pct+'%)</strong></p><p>'+(pct>=80?'Buen desempeño en este repaso.':'Repasa las lecciones y vuelve a intentarlo.')+'</p><p>Este examen es de práctica, no una certificación oficial.</p><button class="btn" onclick="home()">Volver al inicio</button></section>';return}let q=examQuestions[examIndex];app.innerHTML='<button class="btn secondary" onclick="home()">← Salir</button><section class="card"><span class="pill">Examen · '+(examIndex+1)+' de '+examQuestions.length+'</span><h2>'+esc(q.q)+'</h2>'+q.a.map((a,i)=>'<button class="option" data-exam="'+i+'">'+esc(a)+'</button>').join('')+'<div id="feedback" aria-live="polite"></div></section>';app.querySelectorAll('[data-exam]').forEach(b=>b.addEventListener('click',()=>{if(examLocked)return;examLocked=true;let i=+b.dataset.exam;if(i===q.correct)examScore++;app.querySelectorAll('[data-exam]').forEach(c=>{c.disabled=true;if(+c.dataset.exam===q.correct)c.classList.add('good');if(+c.dataset.exam===i&&i!==q.correct)c.classList.add('bad')});document.getElementById('feedback').innerHTML='<p>'+esc(q.why)+'</p><button class="btn" onclick="examIndex++;examRender()">Continuar →</button>'}))}
function showTeacher(){let cards=[['Hallo, Kinder!','¡Hola, niños!','Rueda de saludos: cada niño saluda a otro.'],['Hört zu!','¡Escuchen!','Juego de eco: escucha y repite una palabra.'],['Zeigt auf das Bild!','¡Señalen la imagen!','Señalar tarjetas de colores o animales.'],['Steht bitte auf!','¡Pónganse de pie, por favor!','Juego de instrucciones con movimiento.'],['Setzt euch bitte!','¡Siéntense, por favor!','Alternar órdenes para practicar comprensión.'],['Sehr gut gemacht!','¡Muy bien hecho!','Reforzar los intentos, no solo los aciertos.'],['Noch einmal, bitte!','¡Una vez más, por favor!','Repetición en coro, luego por parejas.'],['Welche Farbe ist das?','¿Qué color es este?','Mostrar objetos y nombrar sus colores.']];app.innerHTML='<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>🎒 Lehrer-Modus · Kit docente 1</h2><p>Ocho expresiones originales de aula y juegos breves para niños principiantes.</p>'+cards.map((c,i)=>'<div class="card"><h3 lang="de">'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><p class="small">Actividad: '+esc(c[2])+'</p><button class="btn secondary" data-teacher="'+i+'">🔊 Escuchar alemán</button></div>').join('')+'</section>';app.querySelectorAll('[data-teacher]').forEach(b=>b.addEventListener('click',()=>speak(cards[+b.dataset.teacher][0])))}

// V4: repaso espaciado simple, sin dependencias externas.
const CARD_KEY='strudel-v4-cards';
function cardState(){try{return JSON.parse(localStorage.getItem(CARD_KEY)||'{}')}catch(e){return {}}}
function cardDue(c,state){return !state[c.id]||!state[c.id].due||state[c.id].due<=todayKey()}
function showCards(){if(!vocab.length){app.innerHTML='<section class="card"><h2>Tarjetas no disponibles</h2><p>Verifica que vocab.json esté subido a GitHub.</p><button class="btn" onclick="home()">Volver</button></section>';return}
let state=cardState(),due=vocab.filter(c=>cardDue(c,state));app.innerHTML='<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>🗂️ Vocabulario con artículos</h2><p>60 tarjetas originales organizadas en cinco temas. Escucha el alemán, intenta recordar el significado y después revela la respuesta.</p><p><strong>'+due.length+' tarjetas pendientes hoy</strong> de '+vocab.length+'. Las tarjetas fáciles vuelven más adelante; las difíciles se repiten antes.</p><div class="actions"><button class="btn" onclick="startCards(false)">Repasar pendientes</button><button class="btn secondary" onclick="startCards(true)">Practicar todas</button></div><h3>Temas</h3>'+[...new Set(vocab.map(c=>c.group))].map(g=>'<p>• '+esc(g)+' ('+vocab.filter(c=>c.group===g).length+')</p>').join('')+'</section>'}
function startCards(all){let state=cardState();cardQueue=vocab.filter(c=>all||cardDue(c,state)).map(c=>c.id);cardIndex=0;renderCard()}
function renderCard(){if(cardIndex>=cardQueue.length){app.innerHTML='<section class="card"><h2>🎉 ¡Repaso terminado!</h2><p>Las tarjetas se programaron para próximas sesiones.</p><button class="btn" onclick="showCards()">Ver tarjetas</button><button class="btn secondary" onclick="home()">Inicio</button></section>';return}selectedCard=vocab.find(c=>c.id===cardQueue[cardIndex]);let c=selectedCard;app.innerHTML='<button class="btn secondary" onclick="showCards()">← Tarjetas</button><section class="card"><span class="pill">'+(cardIndex+1)+' de '+cardQueue.length+' · '+esc(c.group)+'</span><h2 lang="de" style="font-size:2rem">'+esc(c.de)+'</h2><button class="btn secondary" onclick="speak(selectedCard.de)">🔊 Escuchar</button><div id="cardAnswer" style="margin-top:18px"><button class="btn" onclick="revealCard()">Mostrar traducción</button></div></section>'}
function revealCard(){document.getElementById('cardAnswer').innerHTML='<h3>'+esc(selectedCard.es)+'</h3><p>¿La recordaste antes de revelar la respuesta?</p><div class="actions"><button class="btn secondary" onclick="rateCard(false)">🔁 Todavía no</button><button class="btn" onclick="rateCard(true)">✓ Sí, la sabía</button></div>'}
function rateCard(known){let c=selectedCard,state=cardState(),old=state[c.id]||{streak:0},streak=known?(old.streak||0)+1:0,days=known?([1,3,7,14,30][Math.min(streak-1,4)]):0,d=new Date();d.setDate(d.getDate()+days);let due=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');state[c.id]={streak,due};localStorage.setItem(CARD_KEY,JSON.stringify(state));cardIndex++;renderCard()}
function showListening(){if(!listening.length){app.innerHTML='<section class="card"><h2>Audios no disponibles</h2><p>Verifica que listening.json esté subido a GitHub.</p><button class="btn" onclick="home()">Volver</button></section>';return}listenIndex=0;listenScore=0;renderListening()}
function renderListening(){if(listenIndex>=listening.length){app.innerHTML='<section class="card"><h2>🎧 Escucha completada</h2><p><strong>'+listenScore+' de '+listening.length+'</strong> respuestas correctas.</p><p>Vuelve a escuchar las frases y repítelas en voz alta.</p><button class="btn" onclick="home()">Inicio</button><button class="btn secondary" onclick="showListening()">Repetir</button></section>';return}let q=listening[listenIndex];app.innerHTML='<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><span class="pill">Audio '+(listenIndex+1)+' de '+listening.length+'</span><h2>Escucha y selecciona el significado</h2><p>Escucha sin leer la frase. Puedes repetir el audio.</p><button class="btn" onclick="speak(listening[listenIndex].de)">🔊 Reproducir alemán</button><div id="listenChoices">'+q.options.map((x,i)=>'<button class="option" data-listen="'+i+'">'+esc(x)+'</button>').join('')+'</div><div id="listenFeedback" aria-live="polite"></div></section>';app.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',()=>answerListening(+b.dataset.listen)))}
function answerListening(i){let q=listening[listenIndex],correct=q.options.indexOf(q.correct);if(app.querySelector('[data-listen]:disabled'))return;if(i===correct)listenScore++;app.querySelectorAll('[data-listen]').forEach(b=>{b.disabled=true;if(+b.dataset.listen===correct)b.classList.add('good');if(+b.dataset.listen===i&&i!==correct)b.classList.add('bad')});document.getElementById('listenFeedback').innerHTML='<p><strong>'+(i===correct?'¡Correcto!':'Escucha de nuevo para afianzar.')+'</strong></p><p lang="de">'+esc(q.de)+'</p><p>'+esc(q.correct)+'</p><button class="btn secondary" onclick="speak(listening[listenIndex].de)">🔊 Repetir frase</button> <button class="btn" onclick="listenIndex++;renderListening()">Siguiente →</button>'}


// Strudel integral: extensions preserve keys from versions 1–4.
let currentLevel='Todos',levelExam=[],levelExamIndex=0,levelExamScore=0;
const homeBase=home;
home=function(){homeBase();let menu=`<section class="card"><h2>🧭 Elige tu nivel</h2><p>Estudia a tu ritmo. Las unidades superiores son de práctica complementaria, no una certificación.</p><div class="actions">${['Todos','A1.1','A1.2','A2.1','A2.2','B1.1'].map(v=>`<button class="btn ${v===currentLevel?'':'secondary'}" data-level-select="${v}">${v}</button>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="showDashboard()">📊 Mi progreso</button><button class="btn secondary" onclick="showBackup()">💾 Copia de seguridad</button><button class="btn secondary" onclick="showTeacherPlus()">👩‍🏫 Modo docente completo</button><button class="btn secondary" onclick="showExamLevels()">📝 Exámenes por nivel</button></div></section>`;app.insertAdjacentHTML('afterbegin',menu);app.querySelectorAll('[data-level-select]').forEach(b=>b.addEventListener('click',()=>{currentLevel=b.dataset.levelSelect;home()}));app.querySelectorAll('.lesson').forEach(c=>c.hidden=currentLevel!=='Todos'&&c.dataset.level!==currentLevel);document.getElementById('status').textContent=lessons.filter(l=>saved[l.id]?.done).length+' de '+lessons.length+' unidades · '+currentLevel;};
function showProduction(i){let l=lessons[i],key='strudel-writing-'+l.id;app.innerHTML=`<button class="btn secondary" onclick="openLesson(${i})">← Unidad</button><section class="card"><span class="pill">${esc(l.level)}</span><h2>📖 Leer, escribir y hablar</h2><p>Lee el texto y escucha la pronunciación.</p><div class="card" lang="de">${esc(l.reading||l.examples.join(' '))}</div><button class="btn secondary" id="readAudio">🔊 Escuchar texto</button><h3>✍️ Producción escrita</h3><p>${esc(l.task||'Escribe tres frases propias.')}</p><textarea id="writing" rows="6" style="width:100%;font:inherit;padding:14px;border-radius:12px" placeholder="Schreibe hier auf Deutsch …">${esc(localStorage.getItem(key)||'')}</textarea><p class="small">Se guarda en este dispositivo. No hay corrección automática de textos libres.</p><button class="btn" id="saveWriting">Guardar texto</button><h3>🗣️ Producción oral</h3><p>Lee tu texto en voz alta, vuelve a escuchar el modelo y compáralo. La app no califica tu pronunciación automáticamente.</p><button class="btn secondary" id="readAgain">🔊 Repetir modelo</button><p id="writeMsg" aria-live="polite"></p></section>`;document.getElementById('readAudio').onclick=()=>speak(l.reading||l.examples.join(' '));document.getElementById('readAgain').onclick=()=>speak(l.examples[0]);document.getElementById('saveWriting').onclick=()=>{localStorage.setItem(key,document.getElementById('writing').value);document.getElementById('writeMsg').textContent='✓ Texto guardado en este dispositivo.'};}
function showDashboard(){let rows=['A1.1','A1.2','A2.1','A2.2','B1.1'].map(v=>{let ls=lessons.filter(l=>l.level===v),n=ls.filter(l=>saved[l.id]?.done).length;return `<div class="card"><strong>${v}: ${n}/${ls.length} unidades</strong><div class="bar"><div class="fill" style="width:${Math.round(100*n/ls.length)}%"></div></div></div>`}).join('');let exam=JSON.parse(localStorage.getItem('strudel-exam-last')||'null');app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>📊 Tu avance</h2>${rows}<p>Tarjetas repasadas: ${Object.keys(cardState()).length}/${vocab.length}</p><p>Errores registrados: ${errors.length}</p><p>Último examen A1: ${exam?esc(exam.score+' de '+exam.total+' · '+exam.date):'Todavía no realizado'}</p><p class="small">Completar unidades no equivale a obtener un nivel oficial MCER.</p></section>`}
function showBackup(){app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>💾 Respaldar y restaurar</h2><p>Descarga un archivo JSON con tu progreso, errores, tarjetas, sesiones y textos escritos. Guárdalo en un lugar privado.</p><div class="actions"><button class="btn" onclick="exportBackup()">⬇️ Exportar datos</button><label class="btn secondary" style="cursor:pointer">⬆️ Importar datos<input id="importFile" type="file" accept=".json,application/json" style="display:none"></label></div><p id="backupMsg" aria-live="polite"></p><p class="small">La importación sustituye únicamente las claves Strudel incluidas en el respaldo. Comprueba el origen del archivo.</p></section>`;document.getElementById('importFile').addEventListener('change',importBackup)}
function exportBackup(){let data={format:'strudel-backup-1',exported:new Date().toISOString(),storage:{}};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('strudel-'))data.storage[k]=localStorage.getItem(k)}let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strudel-respaldo-'+todayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importBackup(ev){let f=ev.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('Archivo demasiado grande');let data=JSON.parse(await f.text());if(data.format!=='strudel-backup-1'||!data.storage||typeof data.storage!=='object')throw Error('Formato incorrecto');let entries=Object.entries(data.storage);if(entries.some(([k,v])=>!k.startsWith('strudel-')||typeof v!=='string'))throw Error('Datos inválidos');if(!confirm('¿Importar este respaldo y reemplazar los datos correspondientes?'))return;entries.forEach(([k,v])=>localStorage.setItem(k,v));document.getElementById('backupMsg').textContent='✓ Respaldo importado. Recarga la aplicación para ver los cambios.'}catch(e){document.getElementById('backupMsg').textContent='No se pudo importar: '+e.message}}
function showExamLevels(){app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>📝 Evaluaciones por nivel</h2><p>Pruebas de repaso de opción múltiple, no exámenes oficiales.</p>${['A1.1','A1.2','A2.1','A2.2','B1.1'].map(v=>`<button class="option" data-level-exam="${v}">Examen ${v} · ${lessons.filter(l=>l.level===v).length*2} preguntas</button>`).join('')}</section>`;app.querySelectorAll('[data-level-exam]').forEach(b=>b.onclick=()=>{currentLevel=b.dataset.levelExam;levelExam=lessons.filter(l=>l.level===currentLevel).flatMap(l=>l.questions.slice(0,2));levelExamIndex=0;levelExamScore=0;renderLevelExam()})}
function renderLevelExam(){if(levelExamIndex===levelExam.length){let pct=Math.round(100*levelExamScore/levelExam.length);localStorage.setItem('strudel-exam-'+currentLevel,JSON.stringify({date:todayKey(),score:levelExamScore,total:levelExam.length}));app.innerHTML=`<section class="card"><h2>Resultado ${currentLevel}</h2><p><strong>${levelExamScore}/${levelExam.length} (${pct}%)</strong></p><p>Esta prueba mide reconocimiento de frases, no todas las competencias del nivel.</p><button class="btn" onclick="showExamLevels()">Más exámenes</button></section>`;return}let q=levelExam[levelExamIndex];app.innerHTML=`<button class="btn secondary" onclick="showExamLevels()">← Salir</button><section class="card"><span class="pill">${currentLevel} · ${levelExamIndex+1}/${levelExam.length}</span><h2>${esc(q.q)}</h2>${q.a.map((a,i)=>`<button class="option" data-answer="${i}">${esc(a)}</button>`).join('')}<div id="examFeedback" aria-live="polite"></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let n=+b.dataset.answer;app.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(+x.dataset.answer===q.correct)x.classList.add('good');if(+x.dataset.answer===n&&n!==q.correct)x.classList.add('bad')});if(n===q.correct)levelExamScore++;document.getElementById('examFeedback').innerHTML=`<p>${esc(q.why)}</p><button class="btn" id="examNext">Siguiente →</button>`;document.getElementById('examNext').onclick=()=>{levelExamIndex++;renderLevelExam()}})}
const teacherUnits=[['Saludos y nombres','Hallo! Wie heißt du?','Círculo de nombres con pelota; cada niño saluda y se presenta.'],['Colores','Rot, blau, gelb, grün','Búsqueda de objetos del color indicado.'],['Números','Eins, zwei, drei, vier, fünf','Contar saltos y objetos del aula.'],['Familia','Das ist meine Mutter.','Dibujar la familia y describir dos integrantes.'],['Animales','Der Hund, die Katze, das Pferd','Adivinar el animal por su sonido o gesto.'],['Comida','Ich mag Äpfel.','Mercado ficticio con tarjetas de alimentos.'],['Cuerpo','Das ist meine Hand.','Juego de movimiento: mostrar partes del cuerpo.'],['Rutina','Ich stehe um sieben Uhr auf.','Ordenar tarjetas de acciones cotidianas.'],['Clima','Heute ist es sonnig.','Presentador del tiempo con dibujos.'],['Objetos de clase','Das Buch, der Stift, die Tasche','Señalar objetos con artículos y colores.']];
function showTeacherPlus(){app.innerHTML=`<button class="btn secondary" onclick="home()">← Inicio</button><section class="card"><h2>👩‍🏫 Taller docente infantil</h2><p>Diez microlecciones originales para clases de 15–25 minutos. Ajusta el ritmo a la edad y comprensión del grupo.</p>${teacherUnits.map((x,i)=>`<div class="card"><span class="pill">Actividad ${i+1}</span><h3>${esc(x[0])}</h3><p lang="de">${esc(x[1])}</p><p>${esc(x[2])}</p><button class="btn secondary" data-tvoice="${i}">🔊 Modelo oral</button></div>`).join('')}</section>`;app.querySelectorAll('[data-tvoice]').forEach(b=>b.onclick=()=>speak(teacherUnits[+b.dataset.tvoice][1]))}


function renderAcademic(l){
 const vocab=(l.vocabulary||[]).map(v=>`<tr><td lang="de"><strong>${esc(v.de)}</strong></td><td>${esc(v.es)}</td><td><button class="btn secondary" data-speak="${esc(v.de)}" aria-label="Escuchar ${esc(v.de)}">🔊</button></td></tr>`).join('');
 const dialog=(l.dialogue||[]).map(d=>`<div class="card"><strong>${esc(d.speaker)}:</strong> <span lang="de">${esc(d.de)}</span> <button class="btn secondary" data-speak="${esc(d.de)}">🔊</button></div>`).join('');
 return `<h3>🎯 Objetivos</h3><ul>${(l.objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ul><h3>📚 Vocabulario esencial</h3><div style="overflow-x:auto"><table class="voc-table"><thead><tr><th>Alemán</th><th>Español</th><th>Audio</th></tr></thead><tbody>${vocab}</tbody></table></div><h3>💬 Diálogo modelo</h3>${dialog}<h3>📖 Comprensión lectora</h3><p lang="de">${esc(l.reading||'')}</p><p class="small">Identifica el tema, localiza dos palabras conocidas y explica en español la idea principal.</p><h3>✍️ Escritura</h3><p>${esc(l.writing_prompt||'Escribe frases propias.')}</p><h3>🗣️ Expresión oral</h3><p>${esc(l.speaking_prompt||'Practica en voz alta.')}</p><p class="small">Autoevaluación: ¿pronunciaste con claridad, usaste vocabulario y comunicaste la idea?</p>`;
}

Promise.all([fetch('vocab.json').then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('listening.json').then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([v,l])=>{vocab=v;listening=l});
fetch('lessons.json').then(r=>{if(!r.ok)throw Error('Sin datos');return r.json()}).then(x=>{lessons=x;home()}).catch(()=>{app.innerHTML='<section class="card"><h2>No se cargaron las lecciones</h2><p>Abre la aplicación desde GitHub Pages o un servidor web; no abras index.html directamente como archivo.</p></section>'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
